name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute on gradlew
        run: chmod +x gradlew

      - name: ServiceLoader descriptors
        run: |
          set -euo pipefail
          antora="$(cat integrations/antora1000/src/main/resources/META-INF/services/cc.opencar.assistant.api.VehicleIntegration)"
          ihu="$(cat integrations/ihu629g/src/main/resources/META-INF/services/cc.opencar.assistant.api.VehicleIntegration)"
          ha="$(cat plugins/homeassistant/src/main/resources/META-INF/services/cc.opencar.assistant.api.plugin.OcaPlugin)"
          echo "antora1000 -> $antora"
          echo "ihu629g -> $ihu"
          echo "homeassistant -> $ha"
          echo "$antora" | grep -q 'Antora1000Integration'
          echo "$ihu" | grep -q 'Ihu629gIntegration'
          echo "$ha" | grep -q 'HomeAssistantPlugin'
          test -f libs/signing/community.pem
          test -f libs/signing/community.pk8
          test -f NOTICE
          test -f LICENSE
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f docs/disclaimer.md

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug :signing:compileKotlin --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :integrations:platform:common:testDebugUnitTest --no-daemon --stacktrace
