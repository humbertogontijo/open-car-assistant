name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships an Android SDK. Avoid android-actions/setup-android:
      # its default still installs the obsolete `tools` package removed from sdkmanager.
      - name: Accept Android licenses & ensure platform
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || \
            yes | sdkmanager --licenses >/dev/null || true
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          echo "Using sdkmanager=$SDKMANAGER"
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute on gradlew
        run: chmod +x gradlew

      - name: ServiceLoader descriptors
        run: |
          set -euo pipefail
          antora="$(cat integrations/antora1000/src/main/resources/META-INF/services/cc.opencar.assistant.api.VehicleIntegration)"
          ihu="$(cat integrations/ihu629g/src/main/resources/META-INF/services/cc.opencar.assistant.api.VehicleIntegration)"
          ha="$(cat plugins/homeassistant/src/main/resources/META-INF/services/cc.opencar.assistant.api.plugin.OcaPlugin)"
          echo "antora1000 -> $antora"
          echo "ihu629g -> $ihu"
          echo "homeassistant -> $ha"
          echo "$antora" | grep -q 'Antora1000Integration'
          echo "$ihu" | grep -q 'Ihu629gIntegration'
          echo "$ha" | grep -q 'HomeAssistantPlugin'
          test -f libs/signing/community.pem
          test -f libs/signing/community.pk8
          test -f NOTICE
          test -f LICENSE
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f docs/disclaimer.md

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug :signing:compileKotlin --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :integrations:platform:common:testDebugUnitTest --no-daemon --stacktrace
